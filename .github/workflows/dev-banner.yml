name: Dev banner

# Redraws the README's dev-build banner after every Docker Release run. The
# banner isn't committed to master: it is rendered from the
# releases API (scripts/dev_banner.py) and force-pushed as banner.svg to the
# unprotected orphan branch `readme-banner`, which the README embeds. When no
# pre-release is newer than the latest stable release, the image is empty.
#
# workflow_run, not `release`: releases made with GITHUB_TOKEN start no other
# workflows, and a tag push runs docker-release.yml from the tagged (feature-branch)
# commit, while workflow_run always runs this file from master.

on:
  workflow_run:
    workflows: ["Docker Release (GHCR)"]
    types: [completed]
  # A change to the banner itself (its first merge creates readme-banner).
  push:
    branches: [master]
    paths:
      - .github/workflows/dev-banner.yml
      - scripts/dev_banner.py
  # After deleting or editing a release by hand.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-banner
  cancel-in-progress: false

jobs:
  banner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Render banner
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          export DEV_BANNER_IMAGE="ghcr.io/${OWNER,,}/dockge"
          gh api "repos/${REPO}/releases" --paginate | python3 scripts/dev_banner.py > "$RUNNER_TEMP/banner.svg"
          cat "$RUNNER_TEMP/banner.svg"

      - name: Publish to the readme-banner branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          current="$RUNNER_TEMP/current.svg"
          if gh api "repos/${REPO}/contents/banner.svg?ref=readme-banner" \
               -H "Accept: application/vnd.github.raw" > "$current" 2>/dev/null \
             && cmp -s "$current" "$RUNNER_TEMP/banner.svg"; then
            echo "Banner unchanged."
            exit 0
          fi
          dir="$RUNNER_TEMP/readme-banner"
          git init -q -b readme-banner "$dir"
          cp "$RUNNER_TEMP/banner.svg" "$dir/banner.svg"
          printf '%s\n' \
            "Generated by .github/workflows/dev-banner.yml on every release; embedded by the README on master." \
            "Force-pushed each time: don't commit here." > "$dir/README.md"
          git -C "$dir" add banner.svg README.md
          git -C "$dir" -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Dev banner for the current releases"
          gh auth setup-git
          git -C "$dir" push --force "https://github.com/${REPO}.git" readme-banner
