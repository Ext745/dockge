name: CI

on:
  push:
    # Not a bare `push:`, which would also run on tag pushes and repeat the suite on every release
    branches: ['**']
  pull_request:
    branches: [master]
  # Re-run by hand; it runs every job (no base to compare against)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docs-only changes skip the build below, but still produce a successful CI run, which the
  # release workflow's gate requires for the tagged commit
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci-changes.sh "$BASE" >> "$GITHUB_OUTPUT"

  ci:
    needs: changes
    # A failed or skipped `changes` job runs everything (fail closed)
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Lint
        run: npm run lint

      - name: Check TypeScript
        run: npm run check-ts

      - name: Build frontend
        run: npm run build:frontend

      - name: Download shellcheck
        env:
          # Bumped by hand; checksum is the release asset's digest from the GitHub API, so a
          # tampered or substituted binary is refused rather than run
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
        run: |
          set -euo pipefail
          curl -fsSL -o shellcheck.tar.gz \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
          echo "${SHELLCHECK_SHA256}  shellcheck.tar.gz" | sha256sum -c -
          tar xzf shellcheck.tar.gz --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          rm shellcheck.tar.gz

      - name: Shellcheck
        run: |
          set -euo pipefail
          git ls-files -z '*.sh' | xargs -0 ./shellcheck -S warning
